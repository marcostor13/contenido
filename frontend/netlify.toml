[build]
  command = "npm ci && npm run build"
  publish = "dist"

[functions]
  directory = "api"
  node_bundler = "esbuild"

# Cron base: corre cada hora. El on/off y la frecuencia real (cada cuántas horas
# genera) se controlan desde el administrador y se guardan en la base de datos.
[functions."autogen"]
  schedule = "@hourly"

[dev]
  command = "npm run dev"
  targetPort = 4321

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/article/*"
  to = "/article/"
  status = 200
